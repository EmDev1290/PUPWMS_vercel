<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUP-PQ Academic Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css?v=20261012_3">
</head>

<body class="bg-slate-900 text-gray-800 font-['Inter'] antialiased overflow-hidden select-none">

    <div id="login-overlay" class="fixed inset-0 z-[200] flex items-center justify-center">
        <!-- Rotating Picture Slideshow (Bright, Natural & Changing Smoothly) -->
        <div id="slideshow-container" class="absolute inset-0 overflow-hidden">
            <div class="slideshow-slide active"></div>
            <div class="slideshow-slide"></div>
            <div class="slideshow-slide"></div>
            <div class="slideshow-slide"></div>
            <div class="slideshow-slide"></div>
            <div class="slideshow-slide"></div>
        </div>

        <!-- Light Elegant Ambient Overlay (No Heavy Darkness) -->
        <div class="absolute inset-0 login-light-overlay pointer-events-none"></div>

        <!-- Transparent Glassmorphism Login Modal with Highlighted Text -->
        <div class="relative login-glass-card p-8 md:p-10 rounded-3xl w-full max-w-md mx-4 transform transition-all duration-300">
            <!-- PUP Logo in Golden Highlight Ring -->
            <div class="w-24 h-24 rounded-full mx-auto mb-4 overflow-hidden border-2 border-amber-400 shadow-2xl shadow-black/70 ring-4 ring-white/30 bg-white p-1">
                <img src="../style/PUP LOGO.png" onerror="this.src='https://placehold.co/150x150?text=PUP'"
                    alt="PUP Logo" class="w-full h-full object-contain">
            </div>

            <!-- Highly Visible Headings -->
            <h1 class="text-3xl font-extrabold text-center text-white mb-1.5 login-text-shadow tracking-tight">
                PUP Parañaque
            </h1>
            <p class="text-amber-300 text-xs font-bold text-center mb-8 uppercase tracking-[0.25em] login-subtext-shadow">
                Workload Management System
            </p>

            <div class="space-y-4">
                <div>
                    <label for="login-user" class="block text-xs font-bold text-amber-200 uppercase tracking-wider login-subtext-shadow mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="user" class="w-3.5 h-3.5 text-amber-300"></i>
                        Username
                    </label>
                    <input type="text" id="login-user"
                        class="glass-input w-full px-4 py-3 text-sm font-semibold rounded-xl outline-none transition-all placeholder:text-slate-400"
                        placeholder="aide_pq or head_pq" autocomplete="username">
                </div>
                <div>
                    <label for="login-pass" class="block text-xs font-bold text-amber-200 uppercase tracking-wider login-subtext-shadow mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-300"></i>
                        Password
                    </label>
                    <input type="password" id="login-pass"
                        class="glass-input w-full px-4 py-3 text-sm font-semibold rounded-xl outline-none transition-all placeholder:text-slate-400"
                        placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <p id="login-error" class="text-rose-200 bg-rose-950/85 border border-rose-500/60 rounded-xl py-2 px-3 text-xs hidden text-center font-bold shadow-lg"></p>

                <button id="login-button" type="button" onclick="attemptLogin()"
                    class="w-full mt-2 py-3.5 rounded-xl font-bold text-white text-sm bg-gradient-to-r from-[#780000] via-[#8b0000] to-[#780000] hover:from-[#900000] hover:to-[#a00000] shadow-xl shadow-black/50 border border-amber-400/40 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i data-lucide="log-in" class="w-4 h-4 text-amber-300"></i>
                    <span>Enter System</span>
                </button>

                <button id="forgot-password-button" type="button"
                    class="w-full mt-3 text-xs font-semibold text-amber-200/90 hover:text-white underline underline-offset-4 login-subtext-shadow transition-colors">
                    Forgot Password?
                </button>
            </div>
        </div>
    </div>

    <script src="../JS/tempDatabase.js"></script>
    <script src="../JS/app.common.js?v=20261012_3"></script>
    <script src="../JS/app.modal.js?v=20261012_3"></script>
    <script src="../JS/app.page-index.js?v=20261012_3"></script>
    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>

</html>
